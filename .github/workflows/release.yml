name: Release deployment

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# 生产环境的发布绝不能相互取消或并行执行。
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: release verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test ../server/tests/merge.test.cjs
      # 与生产一致地注入同步服务地址，确认 Tag 产物不是“仅本地模式”。
      - run: npm run build
        env:
          VITE_POCKETBASE_URL: https://yaoshitu.xyz

  deploy:
    name: deploy production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
    steps:
      - name: 配置受信 SSH 主机与部署密钥
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/yaoshitu_deploy
          chmod 600 ~/.ssh/yaoshitu_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: 在服务器发布精确 Tag
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i ~/.ssh/yaoshitu_deploy
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )
          # 空端口使用 SSH 默认的 22；配置端口时必须是合法的十进制端口，
          # 让错误直接指向 Secret，而不是让 ssh 只输出通用 usage。
          if [ -n "${DEPLOY_SSH_PORT:-}" ]; then
            case "$DEPLOY_SSH_PORT" in
              *[!0-9]* | '') echo "DEPLOY_SSH_PORT 必须为 1 到 65535 的纯数字" >&2; exit 2;;
            esac
            if [ "$DEPLOY_SSH_PORT" -lt 1 ] || [ "$DEPLOY_SSH_PORT" -gt 65535 ]; then
              echo "DEPLOY_SSH_PORT 必须为 1 到 65535 的纯数字" >&2
              exit 2
            fi
            ssh_options+=(-p "$DEPLOY_SSH_PORT")
          fi
          tag="${GITHUB_REF_NAME}"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$tag'" <<'REMOTE'
          set -euo pipefail
          tag="$1"
          case "$tag" in v[0-9]*) ;; *) echo "非法发布 Tag: $tag" >&2; exit 2;; esac

          app_root=/opt/yaoshitu
          releases=/opt/yaoshitu-releases
          release="$releases/$tag"
          test -d "$app_root/.git"
          git -C "$app_root" fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          expected="$(git -C "$app_root" rev-parse "refs/tags/$tag^{commit}")"

          if [ -d "$release" ]; then
            test "$(git -C "$release" rev-parse HEAD)" = "$expected"
          else
            mkdir -p "$releases"
            git -C "$app_root" worktree add --detach "$release" "refs/tags/$tag"
          fi

          exec bash "$release/server/deploy/release.sh" "$tag"
          REMOTE
