name: Release deployment

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# 生产环境的发布绝不能相互取消或并行执行。
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: release verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test ../server/tests/merge.test.cjs
      # 与生产一致地注入同步服务地址，确认 Tag 产物不是“仅本地模式”。
      - run: npm run build
        env:
          VITE_POCKETBASE_URL: https://yaoshitu.xyz

  deploy:
    name: deploy production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
    steps:
      - name: 配置受信 SSH 主机与部署密钥
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?production 环境缺少 DEPLOY_HOST Secret}"
          : "${DEPLOY_USER:?production 环境缺少 DEPLOY_USER Secret}"
          : "${DEPLOY_SSH_KEY:?production 环境缺少 DEPLOY_SSH_KEY Secret}"
          : "${DEPLOY_KNOWN_HOSTS:?production 环境缺少 DEPLOY_KNOWN_HOSTS Secret}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/yaoshitu_deploy
          chmod 600 ~/.ssh/yaoshitu_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: 在服务器发布精确 Tag
        shell: bash
        run: |
          set -euo pipefail
          # Environment Secret 有时会被网页输入框带入不可见的换行；这些字段
          # 本身不允许空白，先规范化后再做严格校验。
          deploy_host="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          deploy_user="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
          port="$(printf '%s' "${DEPLOY_SSH_PORT:-22}" | tr -d '[:space:]')"
          case "$port" in
            *[!0-9]* | '') echo "DEPLOY_SSH_PORT 必须为 1 到 65535 的纯数字" >&2; exit 2;;
          esac
          if [ "$port" -lt 1 ] || [ "$port" -gt 65535 ]; then
            echo "DEPLOY_SSH_PORT 必须为 1 到 65535 的纯数字" >&2
            exit 2
          fi
          case "$deploy_host" in '') echo "DEPLOY_HOST 不能为空" >&2; exit 2;; esac
          case "$deploy_user" in '') echo "DEPLOY_USER 不能为空" >&2; exit 2;; esac
          # 使用固定别名发起连接，不让 Secret 参与 ssh 命令行参数解析。
          ssh_config="$RUNNER_TEMP/yaoshitu_ssh_config"
          {
            printf '%s\n' 'Host yaoshitu-production'
            printf '  HostName %s\n' "$deploy_host"
            printf '  User %s\n' "$deploy_user"
            printf '  Port %s\n' "$port"
            printf '%s\n' '  IdentityFile ~/.ssh/yaoshitu_deploy'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' '  StrictHostKeyChecking yes'
          } > "$ssh_config"
          chmod 600 "$ssh_config"
          tag="${GITHUB_REF_NAME}"
          ssh -F "$ssh_config" yaoshitu-production "bash -s -- '$tag'" <<'REMOTE'
          set -euo pipefail
          tag="$1"
          case "$tag" in v[0-9]*) ;; *) echo "非法发布 Tag: $tag" >&2; exit 2;; esac

          app_root=/opt/yaoshitu
          releases=/opt/yaoshitu-releases
          release="$releases/$tag"
          test -d "$app_root/.git"
          git -C "$app_root" fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          expected="$(git -C "$app_root" rev-parse "refs/tags/$tag^{commit}")"

          if [ -d "$release" ]; then
            test "$(git -C "$release" rev-parse HEAD)" = "$expected"
          else
            mkdir -p "$releases"
            git -C "$app_root" worktree add --detach "$release" "refs/tags/$tag"
          fi

          exec bash "$release/server/deploy/release.sh" "$tag"
          REMOTE
