# Existing-Nginx deployment; obtain HTTPS with Certbot after HTTP verification.
# Export the built web image's /srv/. into this directory before enabling.
server {
    listen 80;
    listen [::]:80;
    server_name yaoshitu.xyz;

    root /var/www/yaoshitu-v0.2.0-dev;
    index index.html;
    client_max_body_size 2m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = /_ { return 404; }
    location ^~ /_/ { return 404; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
